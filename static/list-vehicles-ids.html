<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de IDs - VehículoMarket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .vehicles-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .vehicles-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .vehicles-table th,
        .vehicles-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e5e5e5;
        }

        .vehicles-table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .vehicles-table tbody tr {
            transition: background-color 0.3s;
        }

        .vehicles-table tbody tr:hover {
            background-color: #f9fafb;
        }

        .vehicles-table tbody tr:last-child td {
            border-bottom: none;
        }

        .id-cell {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #667eea;
            cursor: pointer;
            position: relative;
        }

        .id-cell:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .copy-btn {
            background: #eff6ff;
            border: 1px solid #3b82f6;
            color: #1e40af;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            font-weight: 600;
        }

        .copy-btn:hover {
            background: #dbeafe;
            transform: scale(1.05);
        }

        .copy-btn.copied {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .upload-btn {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            color: #92400e;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }

        .upload-btn:hover {
            background: #fde68a;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #999;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .vehicles-table {
                font-size: 0.85rem;
            }

            .vehicles-table th,
            .vehicles-table td {
                padding: 10px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Lista de Vehículos e IDs</h1>
        <p class="subtitle">Copia el ID del vehículo para subir imágenes</p>

        <div class="actions">
            <button class="btn btn-primary" onclick="loadVehicles()">🔄 Recargar</button>
            <a href="/static/upload-images.html" class="btn btn-secondary">📤 Subir Imágenes</a>
            <a href="/static/RequestVehicle.html" class="btn btn-secondary">👈 Ver Catálogo</a>
        </div>

        <div id="stats" class="stats" style="display: none;">
            <div class="stat-card">
                <h3 id="totalVehicles">0</h3>
                <p>Total Vehículos</p>
            </div>
            <div class="stat-card">
                <h3 id="withImages">0</h3>
                <p>Con Imágenes</p>
            </div>
            <div class="stat-card">
                <h3 id="withoutImages">0</h3>
                <p>Sin Imágenes</p>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por marca, modelo o ID...">
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Cargando vehículos...</p>
        </div>

        <div id="tableContainer"></div>
    </div>

    <script>
        let allVehicles = [];
        let filteredVehicles = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadVehicles();

            document.getElementById('searchInput').addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                filteredVehicles = allVehicles.filter(vehicle => {
                    const brand = (vehicle.vehicle_brand || '').toLowerCase();
                    const model = (vehicle.vehicle_model || '').toLowerCase();
                    const id = (vehicle.id || '').toLowerCase();
                    return brand.includes(searchTerm) || model.includes(searchTerm) || id.includes(searchTerm);
                });
                renderTable(filteredVehicles);
            });
        });

        async function loadVehicles() {
            const loadingDiv = document.getElementById('loading');
            const tableContainer = document.getElementById('tableContainer');
            const statsDiv = document.getElementById('stats');

            loadingDiv.style.display = 'block';
            tableContainer.innerHTML = '';
            statsDiv.style.display = 'none';

            try {
                const response = await fetch('http://localhost:8080/api/vehicles/getAll?limit=1000', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    const data = await response.json();
                    allVehicles = Array.isArray(data) ? data : data.vehicles || [];
                    filteredVehicles = [...allVehicles];

                    console.log(`✅ ${allVehicles.length} vehículos cargados`);

                    if (allVehicles.length > 0) {
                        renderTable(allVehicles);
                        updateStats();
                        statsDiv.style.display = 'grid';
                    } else {
                        showEmptyState();
                    }
                } else {
                    showError('Error al cargar los vehículos');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión con el servidor');
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function renderTable(vehicles) {
            const tableContainer = document.getElementById('tableContainer');

            if (vehicles.length === 0) {
                showEmptyState();
                return;
            }

            let html = `
                <table class="vehicles-table">
                    <thead>
                        <tr>
                            <th>ID (UUID)</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Año</th>
                            <th>Imágenes</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            vehicles.forEach(vehicle => {
                const vehicleId = vehicle.id || vehicle.ID || 'N/A';
                const brand = vehicle.vehicle_brand || vehicle.brand || 'N/A';
                const model = vehicle.vehicle_model || vehicle.model || 'N/A';
                const year = vehicle.vehicle_year || vehicle.year || 'N/A';
                const images = vehicle.vehicle_image || vehicle.Image || [];
                const imageCount = Array.isArray(images) ? images.length : 0;
                const imageStatus = imageCount > 0 ? `✅ ${imageCount}` : '❌ 0';

                html += `
                    <tr>
                        <td class="id-cell" onclick="copyToClipboard('${vehicleId}', this)" title="Click para copiar">
                            ${vehicleId}
                        </td>
                        <td>${brand}</td>
                        <td>${model}</td>
                        <td>${year}</td>
                        <td>${imageStatus}</td>
                        <td>
                            <button class="copy-btn" onclick="copyToClipboard('${vehicleId}', this)">📋 Copiar ID</button>
                            <a href="/static/upload-images.html?id=${vehicleId}" class="upload-btn">📤 Subir</a>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            tableContainer.innerHTML = html;
        }

        function updateStats() {
            const total = allVehicles.length;
            const withImages = allVehicles.filter(v => {
                const images = v.vehicle_image || v.Image || [];
                return Array.isArray(images) && images.length > 0;
            }).length;
            const withoutImages = total - withImages;

            document.getElementById('totalVehicles').textContent = total;
            document.getElementById('withImages').textContent = withImages;
            document.getElementById('withoutImages').textContent = withoutImages;
        }

        function copyToClipboard(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                // Cambiar el botón temporalmente
                const originalText = element.textContent;
                element.classList.add('copied');
                element.textContent = '✅ Copiado!';

                setTimeout(() => {
                    element.classList.remove('copied');
                    element.textContent = originalText;
                }, 2000);
            }).catch(err => {
                alert('Error al copiar: ' + err);
            });
        }

        function showEmptyState() {
            const tableContainer = document.getElementById('tableContainer');
            tableContainer.innerHTML = `
                <div class="empty-state">
                    <h2>📭 No hay vehículos</h2>
                    <p>No se encontraron vehículos en la base de datos</p>
                </div>
            `;
        }

        function showError(message) {
            const tableContainer = document.getElementById('tableContainer');
            tableContainer.innerHTML = `
                <div class="empty-state">
                    <h2>❌ Error</h2>
                    <p>${message}</p>
                </div>
            `;
        }

        console.log('✅ List Vehicles IDs page loaded');
    </script>
</body>
</html>
