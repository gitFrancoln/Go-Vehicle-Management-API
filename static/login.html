<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login Animado</title>
        <link rel="stylesheet" href="/static/login.css" />
    </head>
    <body>
        <div id="container" class="container">
            <!-- FORMULARIO INICIAR SESIÓN -->
            <div class="form-container sign-in-container">
                <form id="loginForm">
                    <h1>Iniciar Sesión</h1>
                    <div class="social-container">
                        <a href="#" class="social"
                            ><ion-icon name="logo-facebook"></ion-icon
                        ></a>
                        <a href="#" class="social"
                            ><ion-icon name="logo-google"></ion-icon
                        ></a>
                        <a href="#" class="social"
                            ><ion-icon name="logo-apple"></ion-icon
                        ></a>
                    </div>
                    <span>o usa tu cuenta</span>
                    <input
                        id="email"
                        type="email"
                        placeholder="Email"
                        required
                    />
                    <input
                        id="password"
                        type="password"
                        placeholder="Contraseña"
                        required
                    />
                    <button type="submit">Iniciar Sesión</button>
                </form>
            </div>

            <!-- FORMULARIO REGISTRO -->
            <div class="form-container sign-up-container">
                <form id="signupForm">
                    <h1>Crear Cuenta</h1>
                    <div class="social-container">
                        <a href="#" class="social"
                            ><ion-icon name="logo-facebook"></ion-icon
                        ></a>
                        <a href="#" class="social"
                            ><ion-icon name="logo-google"></ion-icon
                        ></a>
                        <a href="#" class="social"
                            ><ion-icon name="logo-apple"></ion-icon
                        ></a>
                    </div>
                    <span>o usa tu correo electrónico</span>
                    <input id="signupName" type="text" placeholder="Nombre" />
                    <input id="signupEmail" type="email" placeholder="Email" />
                    <input
                        id="signupPassword"
                        type="password"
                        placeholder="Contraseña"
                    />
                    <button type="submit">Registrarse</button>
                </form>
            </div>

            <!-- PANEL VERDE ANIMADO -->
            <div class="overlay-container">
                <div class="overlay">
                    <div class="overlay-panel overlay-left">
                        <h1>¡Bienvenido de nuevo!</h1>
                        <p>
                            Para mantenerse conectado, inicie sesión con su
                            información personal
                        </p>
                        <button class="ghost" id="signIn">
                            Iniciar Sesión
                        </button>
                    </div>
                    <div class="overlay-panel overlay-right">
                        <h1>¡Hola amigo!</h1>
                        <p>
                            Ingrese sus datos personales para comenzar esta
                            aventura
                        </p>
                        <button class="ghost" id="signUp">Registrarse</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- FIN DEL CONTENEDOR -->

        <script src="/static/login.js"></script>
        <script
            type="module"
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
        ></script>
        <script
            nomodule
            src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
        ></script>
    </body>
</html>
